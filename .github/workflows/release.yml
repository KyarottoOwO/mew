name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          wails build -ldflags "-X main.currentVersion=$VERSION"

      - name: Delete accidental release on MEOWWWW (if exists)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "$TAG" --repo KyarottoOwO/MEOWWWW --yes --cleanup-tag || true

      - name: Get commit message
        id: commit
        shell: bash
        run: echo "msg=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Create Release on mew
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe \
            --repo KyarottoOwO/mew \
            --title "MEW $TAG" \
            --notes "${{ steps.commit.outputs.msg }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          RELEASE_URL="https://github.com/KyarottoOwO/mew/releases/tag/$TAG"
          TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT_MSG="${{ steps.commit.outputs.msg }}"
          python3 -c "
          import json, sys, os
          commit_msg = os.environ['COMMIT_MSG']
          payload = {
            'content': '<@&1530333141548404786>',
            'embeds': [{
              'title': 'MEW ' + os.environ['TAG'] + ' Released!',
              'url': os.environ['RELEASE_URL'],
              'color': 15293772,
              'description': 'A new version of **MEW** is now available!\n\n[Download ' + os.environ['TAG'] + '](' + os.environ['RELEASE_URL'] + ')',
              'fields': [
                {'name': 'Version', 'value': os.environ['TAG'], 'inline': True},
                {'name': 'Platform', 'value': 'Windows (x64)', 'inline': True},
                {'name': 'Changelog', 'value': commit_msg, 'inline': False}
              ],
              'footer': {'text': 'MEW - Minecraft Bedrock Texture Pack Manager'},
              'timestamp': os.environ['TIMESTAMP']
            }]
          }
          json.dump(payload, sys.stdout)
          " > /tmp/payload.json
          curl -H "Content-Type: application/json" -d @/tmp/payload.json "$DISCORD_WEBHOOK"
