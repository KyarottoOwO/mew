name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build

      - name: Delete accidental release on MEOWWWW (if exists)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "$TAG" --repo KyarottoOwO/MEOWWWW --yes --cleanup-tag || true

      - name: Create Release on mew
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe \
            --repo KyarottoOwO/mew \
            --title "MEW $TAG" \
            --generate-notes
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        if: steps.release.outputs.tag != ''
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          curl -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"MEW $TAG released!\",\"url\":\"https://github.com/KyarottoOwO/mew/releases/tag/$TAG\",\"color\":15293772,\"description\":\"Download the latest version from [GitHub Releases](https://github.com/KyarottoOwO/mew/releases/tag/$TAG).\"}]}" \
            "$DISCORD_WEBHOOK"
