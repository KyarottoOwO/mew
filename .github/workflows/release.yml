name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build
        run: wails build

      - name: Install UPX
        run: choco install upx -y

      - name: Compress with UPX
        run: upx --best --lzma build/bin/mew.exe

      - name: Delete accidental release on MEOWWWW (if exists)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release delete "$TAG" --repo KyarottoOwO/MEOWWWW --yes --cleanup-tag || true

      - name: Create Release on mew
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" build/bin/mew.exe \
            --repo KyarottoOwO/mew \
            --title "MEW $TAG" \
            --generate-notes
